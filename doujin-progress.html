<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>原稿進捗メモ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf6f0;--card:#fff;--text-primary:#3b2a4a;--text-secondary:#8b7ba0;
  --shadow:0 8px 32px rgba(120,80,160,0.12);--radius:22px;
  --easy-bg:#d1fae5;--easy-text:#059669;--easy-color:#34d399;
  --dragon-bg:#fce7f3;--dragon-text:#be185d;--dragon-color:#f472b6;
  --accent:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;}body{background:var(--bg);font-family:'Zen Maru Gothic',sans-serif;min-height:100vh;color:var(--text-primary);}
body::before{content:'';position:fixed;width:400px;height:400px;background:radial-gradient(circle,#c4b5fd,#f9a8d4);border-radius:50%;filter:blur(80px);opacity:0.18;top:-100px;right:-100px;pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:12px 12px 80px;width:100%;}

.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 0;margin-bottom:6px;}
.app-title{font-family:'Nunito',sans-serif;font-size:19px;font-weight:900;color:var(--text-primary);}
.app-title span{color:var(--accent);}
.btn-settings{display:flex;align-items:center;gap:5px;background:white;border:2px solid #e5dff0;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--text-secondary);cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.06);white-space:nowrap;}

.tabs-wrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:12px;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;border:2px solid transparent;background:white;color:var(--text-secondary);box-shadow:0 2px 8px rgba(0,0,0,0.07);white-space:nowrap;transition:all 0.18s;}
.tab.active{background:var(--accent);color:white;}
.tab-add{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:white;border:2px dashed #d1c4e9;color:var(--accent);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.07);}

.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:12px;}

.deadline-strip{display:flex;gap:8px;margin-bottom:12px;overflow:hidden;}
.deadline-box{flex:1;background:white;border-radius:16px;padding:12px;box-shadow:var(--shadow);text-align:center;}
.deadline-days{font-family:'Nunito',sans-serif;font-size:32px;font-weight:900;line-height:1;}
.deadline-days.urgent{color:#ef4444;}.deadline-days.soon{color:#f97316;}.deadline-days.ok{color:#34d399;}
.deadline-label{font-size:11px;color:var(--text-secondary);margin-top:2px;}
.deadline-date{font-size:11px;color:var(--text-secondary);}

.type-summary{display:flex;gap:8px;margin-bottom:12px;}
.type-card{flex:1;border-radius:14px;padding:10px;text-align:center;}
.type-card.easy{background:var(--easy-bg);}.type-card.dragon{background:var(--dragon-bg);}
.type-emoji{font-size:18px;}.type-name{font-size:11px;font-weight:700;margin:2px 0;}
.type-card.easy .type-name{color:var(--easy-text);}.type-card.dragon .type-name{color:var(--dragon-text);}
.type-nums{font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;color:var(--text-primary);}

.progress-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.progress-label{font-size:12px;font-weight:700;width:48px;flex-shrink:0;color:var(--text-secondary);}
.progress-bar-wrap{flex:1;background:#f1ecfa;border-radius:99px;height:9px;overflow:hidden;}
.progress-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,#a78bfa,#f472b6);transition:width 0.5s;}
.progress-count{font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;color:var(--text-secondary);width:48px;text-align:right;flex-shrink:0;}

.koma-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.section-title{font-size:14px;font-weight:700;}
.koma-actions{display:flex;gap:6px;flex-wrap:wrap;}
.btn-add-koma,.btn-add-page{border:none;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;white-space:nowrap;}
.btn-add-koma{background:var(--accent);color:white;}
.btn-add-page{background:#fff7ed;color:#ea580c;border:1.5px solid #fed7aa;}

.items-list{display:flex;flex-direction:column;gap:6px;}

/* Sort mode banner */
.sort-banner{background:linear-gradient(135deg,#7c3aed,#be185d);color:white;border-radius:14px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;margin-bottom:10px;box-shadow:0 4px 16px rgba(124,58,237,0.3);}
.sort-banner.visible{display:flex;}
.sort-banner-text{font-size:13px;font-weight:700;line-height:1.4;}
.sort-banner-cancel{background:rgba(255,255,255,0.2);border:none;border-radius:99px;color:white;font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;}

/* Page divider */
.page-divider{display:flex;align-items:center;gap:8px;padding:4px 0;}
.page-divider-line{flex:1;height:2px;background:linear-gradient(90deg,#a78bfa44,#f472b644);}
.page-divider-label{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,#ede9fe,#fce7f3);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;color:#7c3aed;white-space:nowrap;flex-shrink:0;}
.page-divider-del{background:none;border:none;color:#c4b5fd;font-size:13px;cursor:pointer;padding:0 2px;}
.page-divider-move{background:none;border:none;color:#c4b5fd;font-size:15px;cursor:pointer;padding:0 4px;line-height:1;}
.page-divider.sort-selected .page-divider-label{background:linear-gradient(135deg,#a78bfa,#f472b6);color:white;}

/* Koma item */
.koma-item{background:#faf8ff;border-radius:13px;padding:10px 10px;border:1.5px solid #ede9fe;display:flex;align-items:flex-start;gap:6px;transition:all 0.2s;min-width:0;overflow:hidden;}
.koma-item.sort-selected{border-color:var(--accent);background:#f0ebff;box-shadow:0 0 0 2px var(--accent);}
.koma-type-badge{flex-shrink:0;font-size:10px;font-weight:700;padding:3px 6px;border-radius:99px;cursor:pointer;white-space:nowrap;margin-top:1px;}
.koma-type-badge.easy{background:var(--easy-bg);color:var(--easy-text);}
.koma-type-badge.dragon{background:var(--dragon-bg);color:var(--dragon-text);}
.koma-info{flex:1;min-width:0;overflow:hidden;}
.koma-name{font-size:13px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.koma-process{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;}
.process-dot{font-size:10px;padding:2px 5px;border-radius:99px;font-weight:700;cursor:pointer;border:1.5px solid transparent;-webkit-tap-highlight-color:transparent;}
.process-dot.done{background:var(--accent);color:white;}
.process-dot.undone{background:#f1ecfa;color:var(--text-secondary);border-color:#e0d9f5;}
.koma-right{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;min-width:28px;}
.koma-delete{background:none;border:none;color:#d1c4e9;font-size:15px;cursor:pointer;padding:2px;line-height:1;}
.koma-delete:hover{color:#ef4444;}
.koma-move{background:none;border:1.5px solid #e5dff0;border-radius:8px;color:var(--text-secondary);font-size:13px;cursor:pointer;padding:3px 6px;line-height:1;font-family:sans-serif;}
.koma-move:hover{background:#f5f0ff;border-color:var(--accent);color:var(--accent);}
.koma-move.active{background:var(--accent);border-color:var(--accent);color:white;}

/* Insert target zones — shown in sort mode */
.insert-zone{height:38px;border:2px dashed #d1c4e9;border-radius:10px;display:none;align-items:center;justify-content:center;font-size:12px;color:var(--text-secondary);cursor:pointer;transition:all 0.15s;margin:1px 0;-webkit-tap-highlight-color:transparent;}
.insert-zone.visible{display:flex;}
.insert-zone:active{border-color:var(--accent);background:#f5f0ff;color:var(--accent);}

.empty-state{text-align:center;padding:20px;color:var(--text-secondary);font-size:13px;line-height:1.8;}
.no-ms{text-align:center;padding:50px 20px;color:var(--text-secondary);}
.no-ms-emoji{font-size:48px;margin-bottom:12px;}
.no-ms-text{font-size:14px;line-height:1.7;margin-bottom:20px;}
.btn-first-ms{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#a78bfa,#f472b6);color:white;border:none;border-radius:99px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;}

.modal-overlay{position:fixed;inset:0;background:rgba(59,42,74,0.4);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:white;border-radius:28px 28px 0 0;padding:20px 20px 44px;width:100%;max-width:480px;animation:slideUp 0.28s cubic-bezier(0.34,1.2,0.64,1) both;max-height:90vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:#e5dff0;border-radius:99px;margin:0 auto 14px;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:14px;}
.form-group{margin-bottom:12px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:4px;}
.form-input{width:100%;max-width:100%;padding:10px 13px;border:2px solid #e5dff0;border-radius:11px;font-family:'Zen Maru Gothic',sans-serif;font-size:14px;color:var(--text-primary);background:#faf8ff;outline:none;}
.form-input:focus{border-color:var(--accent);}
.type-select{display:flex;gap:8px;}
.type-btn{flex:1;padding:10px;border-radius:11px;border:2px solid transparent;font-size:13px;font-weight:700;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;}
.type-btn.easy{background:var(--easy-bg);color:var(--easy-text);}
.type-btn.easy.selected{border-color:var(--easy-color);}
.type-btn.dragon{background:var(--dragon-bg);color:var(--dragon-text);}
.type-btn.dragon.selected{border-color:var(--dragon-color);}
.btn-submit{width:100%;padding:13px;border:none;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#f472b6);color:white;font-family:'Zen Maru Gothic',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
.btn-cancel{width:100%;padding:10px;border:2px solid #e5dff0;border-radius:13px;background:transparent;color:var(--text-secondary);font-family:'Zen Maru Gothic',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
.ms-delete-btn{background:#fff0f0;border:1.5px solid #fecaca;border-radius:10px;color:#ef4444;font-size:13px;font-weight:700;padding:10px;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;width:100%;margin-top:8px;}
</style>
</head>
<body>
<div id="app">
  <div class="app-header">
    <div class="app-title">✏️ 原稿<span>進捗</span>メモ</div>
    <button class="btn-settings" onclick="openMsSettings()" id="btn-ms-settings" style="display:none">⚙️ 設定・編集</button>
  </div>
  <div class="tabs-wrap" id="tabs-wrap"></div>
  <div id="main-content"></div>
</div>

<!-- Modal: Manuscript -->
<div class="modal-overlay" id="modal-ms">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-ms-title">📚 新しい原稿を追加</div>
    <div class="form-group"><label class="form-label">タイトル</label><input class="form-input" id="ms-title-input" placeholder="例：夏コミ新刊"></div>
    <div class="form-group"><label class="form-label">📅 イベント当日</label><input class="form-input" type="date" id="ms-event-date"></div>
    <div class="form-group"><label class="form-label">✂️ 印刷所締め切り</label><input class="form-input" type="date" id="ms-deadline-date"></div>
    <div class="form-group"><label class="form-label">総ページ数（表紙除く）</label><input class="form-input" type="number" id="ms-pages-input" placeholder="例：32" min="1"></div>
    <button class="btn-submit" id="ms-submit-btn" onclick="saveManuscript()">保存する</button>
    <button class="ms-delete-btn" id="ms-delete-btn" style="display:none" onclick="deleteManuscript()">🗑️ この原稿を削除する</button>
    <button class="btn-cancel" onclick="closeModal('modal-ms')">キャンセル</button>
  </div>
</div>

<!-- Modal: Confirm Delete -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">🗑️ 本当に削除しますか？</div>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.6">この原稿とすべてのコマデータが削除されます。元に戻せません。</p>
    <button class="ms-delete-btn" onclick="confirmDelete()">削除する</button>
    <button class="btn-cancel" onclick="closeModal('modal-confirm')">キャンセル</button>
  </div>
</div>

<!-- Modal: Add Koma -->
<div class="modal-overlay" id="modal-koma">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">🎨 コマを追加</div>
    <div class="form-group"><label class="form-label">コマのメモ（任意）</label><input class="form-input" id="koma-name-input" placeholder="例：扉絵、見開き、ラストシーン"></div>
    <div class="form-group">
      <label class="form-label">タイプ</label>
      <div class="type-select">
        <button class="type-btn easy selected" id="type-btn-easy" onclick="selectType('easy')">✨ Easy</button>
        <button class="type-btn dragon" id="type-btn-dragon" onclick="selectType('dragon')">🐉 Dragon</button>
      </div>
    </div>
    <div class="form-group"><label class="form-label">追加するコマ数</label><input class="form-input" type="number" id="koma-count-input" min="1" value="1"></div>
    <button class="btn-submit" onclick="saveKoma()">追加する</button>
    <button class="btn-cancel" onclick="closeModal('modal-koma')">キャンセル</button>
  </div>
</div>

<script>
const PROCESSES=['アタリ','資料','ラフ','下書き','ペン入れ','仕上げ'];
const STORAGE_KEY='doujin-progress-v2';
let data={manuscripts:[],activeId:null};
let selectedType='easy';
let sortSrcIdx=null; // null = not in sort mode; number = index of item being moved

function load(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)data=JSON.parse(s);}catch(e){}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}
function getActive(){return data.manuscripts.find(m=>m.id===data.activeId)||null;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function daysUntil(ds){if(!ds)return null;const t=new Date(ds),n=new Date();t.setHours(0,0,0,0);n.setHours(0,0,0,0);return Math.ceil((t-n)/86400000);}
function daysClass(d){if(d===null)return '';if(d<=3)return 'urgent';if(d<=10)return 'soon';return 'ok';}
function fmtDate(ds){if(!ds)return '未設定';const d=new Date(ds);return `${d.getMonth()+1}/${d.getDate()}`;}
function inSortMode(){return sortSrcIdx!==null;}

function render(){renderTabs();renderMain();}

function renderTabs(){
  const wrap=document.getElementById('tabs-wrap');
  const btn=document.getElementById('btn-ms-settings');
  wrap.innerHTML='';
  data.manuscripts.forEach(ms=>{
    const t=document.createElement('div');
    t.className='tab'+(ms.id===data.activeId?' active':'');
    t.textContent=ms.title||'無題';
    t.onclick=()=>{data.activeId=ms.id;sortSrcIdx=null;save();render();};
    wrap.appendChild(t);
  });
  const add=document.createElement('div');
  add.className='tab-add';add.textContent='+';add.onclick=openAddMs;
  wrap.appendChild(add);
  btn.style.display=data.activeId?'flex':'none';
}

function renderMain(){
  const el=document.getElementById('main-content');
  const ms=getActive();
  if(!ms){
    el.innerHTML=`<div class="no-ms"><div class="no-ms-emoji">📝</div><div class="no-ms-text">まだ原稿が登録されていません。<br>「＋」から追加してみましょう！</div><button class="btn-first-ms" onclick="openAddMs()">＋ 最初の原稿を追加</button></div>`;
    return;
  }
  const items=ms.items||[];
  const komas=items.filter(i=>i.kind==='koma');
  const easyK=komas.filter(k=>k.type==='easy');
  const dragonK=komas.filter(k=>k.type==='dragon');
  const easyDone=easyK.filter(k=>(k.processes||[]).includes('仕上げ')).length;
  const dragonDone=dragonK.filter(k=>(k.processes||[]).includes('仕上げ')).length;
  const totalK=komas.length;
  const totalExp=(ms.pages||0)*6;
  const eventDays=daysUntil(ms.eventDate);
  const deadlineDays=daysUntil(ms.deadlineDate);
  const procCounts=PROCESSES.map(p=>({name:p,done:komas.filter(k=>(k.processes||[]).includes(p)).length,total:totalK}));
  let pn=1;const pageNums={};
  items.forEach(item=>{if(item.kind==='page'){pageNums[item.id]=pn;pn++;}});

  el.innerHTML=`
    <div class="deadline-strip">
      <div class="deadline-box">
        <div class="deadline-days ${daysClass(deadlineDays)}">${deadlineDays!==null?deadlineDays:'—'}</div>
        <div class="deadline-label">✂️ 締め切りまで（日）</div>
        <div class="deadline-date">${fmtDate(ms.deadlineDate)}</div>
      </div>
      <div class="deadline-box">
        <div class="deadline-days ${daysClass(eventDays)}">${eventDays!==null?eventDays:'—'}</div>
        <div class="deadline-label">📅 イベントまで（日）</div>
        <div class="deadline-date">${fmtDate(ms.eventDate)}</div>
      </div>
    </div>
    <div class="type-summary">
      <div class="type-card easy"><div class="type-emoji">✨</div><div class="type-name">Easy</div><div class="type-nums">${easyDone}/${easyK.length} 完了</div></div>
      <div class="type-card dragon"><div class="type-emoji">🐉</div><div class="type-name">Dragon</div><div class="type-nums">${dragonDone}/${dragonK.length} 完了</div></div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text-secondary)">工程別進捗 <span style="font-size:11px">（全${totalK}コマ）</span></div>
      ${totalK===0?'<div style="color:var(--text-secondary);font-size:13px;text-align:center;padding:4px 0">コマを追加すると進捗が表示されます</div>':procCounts.map(p=>`
        <div class="progress-row">
          <div class="progress-label">${p.name}</div>
          <div class="progress-bar-wrap"><div class="progress-bar" style="width:${p.total>0?Math.round(p.done/p.total*100):0}%"></div></div>
          <div class="progress-count">${p.done}/${p.total}</div>
        </div>`).join('')}
      ${totalExp>0?`<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;text-align:right">${ms.pages}p × 6 = 目安${totalExp}コマ｜登録${totalK}コマ</div>`:''}
    </div>
    <div class="card">
      <div class="sort-banner ${inSortMode()?'visible':''}" id="sort-banner">
        <div class="sort-banner-text">↕ 移動先をタップしてください</div>
        <button class="sort-banner-cancel" onclick="exitSortMode()">✕ キャンセル</button>
      </div>
      <div class="koma-header">
        <div class="section-title">🎨 コマ一覧</div>
        <div class="koma-actions">
          <button class="btn-add-page" onclick="addPageDivider()">＋ ページ区切り</button>
          <button class="btn-add-koma" onclick="openAddKoma()">＋ コマを追加</button>
        </div>
      </div>
      <div class="items-list" id="items-list">
        ${items.length===0
          ?'<div class="empty-state">コマやページ区切りを追加してみましょう！<br><small style="color:#c4b5fd">↕ボタンで並び替えできます</small></div>'
          :buildItemsHTML(items,pageNums)}
      </div>
    </div>`;
}

function buildItemsHTML(items,pageNums){
  let html='';
  const inSort=inSortMode();
  items.forEach((item,idx)=>{
    // Insert zone: show between items when in sort mode
    if(inSort && sortSrcIdx!==idx && sortSrcIdx!==idx-1){
      html+=`<div class="insert-zone visible" onclick="moveItemTo(${idx})">▲ ここに移動</div>`;
    }
    if(item.kind==='page'){
      const pn=pageNums[item.id];
      const sel=inSort&&sortSrcIdx===idx;
      html+=`<div class="page-divider${sel?' sort-selected':''}">
        <div class="page-divider-line"></div>
        <div class="page-divider-label">
          📄 ${pn}ページ目
          ${!inSort?`<button class="page-divider-del" onclick="deleteItem('${item.id}')">×</button>`:''}
        </div>
        <div class="page-divider-line"></div>
        <button class="page-divider-move ${sel?'active':''}" onclick="onMoveBtn(${idx})" title="移動">↕</button>
      </div>`;
    } else {
      const procs=item.processes||[];
      const sel=inSort&&sortSrcIdx===idx;
      html+=`<div class="koma-item${sel?' sort-selected':''}">
        <span class="koma-type-badge ${item.type}" onclick="toggleKomaType('${item.id}')">${item.type==='easy'?'✨Easy':'🐉Dragon'}</span>
        <div class="koma-info">
          <div class="koma-name editable-name" data-id="${item.id}" style="cursor:pointer;min-height:18px">${item.name||'<span style="color:#c4b5fd;font-weight:400;font-size:12px">タップで名前を追加</span>'}</div>
          <div class="koma-process">
            ${PROCESSES.map(p=>`<span class="process-dot ${procs.includes(p)?'done':'undone'}" onclick="toggleProcess('${item.id}','${p}')">${p}</span>`).join('')}
          </div>
        </div>
        <div class="koma-right">
          <button class="koma-delete" onclick="deleteItem('${item.id}')">×</button>
          <button class="koma-move ${sel?'active':''}" onclick="onMoveBtn(${idx})" title="移動">↕</button>
        </div>
      </div>`;
    }
  });
  // Insert zone at end
  if(inSort && sortSrcIdx!==items.length-1){
    html+=`<div class="insert-zone visible" onclick="moveItemTo(${items.length})">▲ 一番下に移動</div>`;
  }
  return html;
}

// ↕ button pressed: enter sort mode with this item, or if already selected deselect
function onMoveBtn(idx){
  if(sortSrcIdx===idx){ exitSortMode(); return; }
  sortSrcIdx=idx;
  if(navigator.vibrate) navigator.vibrate(20);
  renderMain();
}

function exitSortMode(){
  sortSrcIdx=null;
  renderMain();
}

function moveItemTo(targetIdx){
  const ms=getActive();if(!ms)return;
  const items=ms.items||[];
  const[moved]=items.splice(sortSrcIdx,1);
  const adj=sortSrcIdx<targetIdx?targetIdx-1:targetIdx;
  items.splice(adj,0,moved);
  ms.items=items;
  sortSrcIdx=null;
  save();renderMain();
}

// ===== Manuscript CRUD =====
let isEditing=false;
function openAddMs(){
  isEditing=false;
  document.getElementById('modal-ms-title').textContent='📚 新しい原稿を追加';
  ['ms-title-input','ms-event-date','ms-deadline-date','ms-pages-input'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ms-delete-btn').style.display='none';
  document.getElementById('ms-submit-btn').textContent='保存する';
  document.getElementById('modal-ms').classList.add('open');
}
function openMsSettings(){
  const ms=getActive();if(!ms)return;
  isEditing=true;
  document.getElementById('modal-ms-title').textContent='⚙️ 原稿の設定';
  document.getElementById('ms-title-input').value=ms.title||'';
  document.getElementById('ms-event-date').value=ms.eventDate||'';
  document.getElementById('ms-deadline-date').value=ms.deadlineDate||'';
  document.getElementById('ms-pages-input').value=ms.pages||'';
  document.getElementById('ms-delete-btn').style.display='block';
  document.getElementById('ms-submit-btn').textContent='更新する';
  document.getElementById('modal-ms').classList.add('open');
}
function saveManuscript(){
  const title=document.getElementById('ms-title-input').value.trim()||'無題';
  const eventDate=document.getElementById('ms-event-date').value;
  const deadlineDate=document.getElementById('ms-deadline-date').value;
  const pages=parseInt(document.getElementById('ms-pages-input').value)||0;
  if(isEditing){
    const ms=getActive();if(!ms)return;
    Object.assign(ms,{title,eventDate,deadlineDate,pages});
  }else{
    data.manuscripts.push({id:uid(),title,eventDate,deadlineDate,pages,items:[]});
    data.activeId=data.manuscripts[data.manuscripts.length-1].id;
  }
  save();closeModal('modal-ms');render();
}
function deleteManuscript(){
  closeModal('modal-ms');
  document.getElementById('modal-confirm').classList.add('open');
}
function confirmDelete(){
  data.manuscripts=data.manuscripts.filter(m=>m.id!==data.activeId);
  data.activeId=data.manuscripts.length>0?data.manuscripts[0].id:null;
  save();closeModal('modal-confirm');render();
}

// ===== Items CRUD =====
function addPageDivider(){
  const ms=getActive();if(!ms)return;
  if(!ms.items)ms.items=[];
  ms.items.push({id:uid(),kind:'page'});
  save();render();
}
function openAddKoma(){
  selectedType='easy';
  document.getElementById('koma-name-input').value='';
  document.getElementById('koma-count-input').value='1';
  updateTypeButtons();
  document.getElementById('modal-koma').classList.add('open');
}
function selectType(type){selectedType=type;updateTypeButtons();}
function updateTypeButtons(){
  document.getElementById('type-btn-easy').className='type-btn easy'+(selectedType==='easy'?' selected':'');
  document.getElementById('type-btn-dragon').className='type-btn dragon'+(selectedType==='dragon'?' selected':'');
}
function saveKoma(){
  const ms=getActive();if(!ms)return;
  if(!ms.items)ms.items=[];
  const name=document.getElementById('koma-name-input').value.trim();
  const count=parseInt(document.getElementById('koma-count-input').value)||1;
  for(let i=0;i<count;i++){
    ms.items.push({id:uid(),kind:'koma',name:count>1?(name?`${name} ${i+1}`:`コマ${i+1}`):(name||''),type:selectedType,processes:[]});
  }
  save();closeModal('modal-koma');render();
}
function deleteItem(id){
  const ms=getActive();if(!ms)return;
  ms.items=(ms.items||[]).filter(i=>i.id!==id);
  save();render();
}
function toggleKomaType(id){
  if(inSortMode())return;
  const ms=getActive();if(!ms)return;
  const k=(ms.items||[]).find(i=>i.id===id);if(!k)return;
  k.type=k.type==='easy'?'dragon':'easy';
  save();render();
}
function toggleProcess(id,process){
  if(inSortMode())return;
  const ms=getActive();if(!ms)return;
  const k=(ms.items||[]).find(i=>i.id===id);if(!k)return;
  if(!k.processes)k.processes=[];
  if(k.processes.includes(process))k.processes=k.processes.filter(p=>p!==process);
  else k.processes.push(process);
  save();render();
}

// Editable koma name — event delegation
document.addEventListener('click', function(e){
  const el = e.target.closest('.editable-name');
  if(!el) return;
  const id = el.dataset.id;
  if(!id || inSortMode()) return;
  const ms = getActive(); if(!ms) return;
  const k = (ms.items||[]).find(i=>i.id===id); if(!k) return;
  const input = document.createElement('input');
  input.value = k.name||'';
  input.placeholder = 'コマ名を入力';
  input.style.cssText = 'width:100%;border:none;border-bottom:2px solid #a78bfa;background:transparent;font-family:\'Zen Maru Gothic\',sans-serif;font-size:13px;font-weight:700;color:#3b2a4a;outline:none;padding:0;';
  input.onclick = e => e.stopPropagation();
  input.onblur = () => { k.name = input.value.trim(); save(); render(); };
  input.onkeydown = e => { if(e.key==='Enter') input.blur(); if(e.key==='Escape') render(); };
  el.replaceWith(input);
  setTimeout(()=>input.focus(), 50);
});

function startEditName(){} // kept for safety

function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});

// Migrate old format
function migrate(){
  data.manuscripts.forEach(ms=>{
    if(ms.komas&&!ms.items){ms.items=ms.komas.map(k=>({...k,kind:'koma'}));delete ms.komas;}
  });
}

load();migrate();
if(data.manuscripts.length>0&&!data.activeId)data.activeId=data.manuscripts[0].id;
render();
</script>
